apiVersion: v1
kind: Namespace
metadata:
  name: sunday-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etherealpod-controller
  namespace: sunday-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etherealpod-controller
rules:
  - apiGroups: ["sunday.system"]
    resources: ["etherealpods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sunday.system"]
    resources: ["etherealpods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etherealpod-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etherealpod-controller
subjects:
  - kind: ServiceAccount
    name: etherealpod-controller
    namespace: sunday-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etherealpod-controller
  namespace: sunday-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: etherealpod-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etherealpod-controller
    spec:
      serviceAccountName: etherealpod-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: sunday-controller:dev
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sunday-data
  namespace: sunday-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sunday-app
  namespace: sunday-system
spec:
  selector:
    app.kubernetes.io/name: sunday-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: sunday.system/v1alpha1
kind: EtherealPod
metadata:
  name: sunday-app
  namespace: sunday-system
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunday-app
    spec:
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sundayapp
          image: sunday-app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_ADDR
              value: :8080
            - name: DATA_PATH
              value: /data/sunday.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sunday-data
