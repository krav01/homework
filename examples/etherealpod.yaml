apiVersion: sunday.system/v1alpha1
kind: EtherealPod
metadata:
  name: sunday-app
  namespace: sunday-system
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunday-app
    spec:
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sundayapp
          image: sunday-app:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_ADDR
              value: :8080
            - name: DATA_PATH
              value: /data/sunday.json
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sunday-data
