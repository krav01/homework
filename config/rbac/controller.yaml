apiVersion: v1
kind: ServiceAccount
metadata:
  name: etherealpod-controller
  namespace: sunday-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: etherealpod-controller
rules:
  - apiGroups: ["sunday.system"]
    resources: ["etherealpods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sunday.system"]
    resources: ["etherealpods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: etherealpod-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: etherealpod-controller
subjects:
  - kind: ServiceAccount
    name: etherealpod-controller
    namespace: sunday-system
